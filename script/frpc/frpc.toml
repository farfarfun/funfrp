# 本文件是示例配置，所有 CHANGE_ME_* 占位符都必须替换成你自己的值后才能使用。
# serverAddr / serverPort / auth.token 必须与你的 frps 服务端完全一致。
#
# 只想先验证一下连通性，可以临时改用 freefrp.net 公开发布的免费测试中转
# （serverAddr = "frp.freefrp.net"、auth.token = "freefrp.net"，见
# https://freefrp.net/docs）。那是一个所有人共用的公开 token，流量会经过
# 第三方服务器，**不要**用于任何生产或涉及隐私的场景。
serverAddr = "CHANGE_ME_FRPS_SERVER_ADDR"
serverPort = 7000
auth.method = "token"
auth.token = "CHANGE_ME_FRPS_TOKEN"

[[proxies]]
name = "web1_xxxxx"
type = "http"
localIP = "192.168.1.2"
localPort = 5000
customDomains = ["nas.yourdomain.com"]

[[proxies]]
name = "web2_xxxxx"
type = "https"
localIP = "192.168.1.2"
localPort = 5001
customDomains = ["nas.yourdomain.com"]

[[proxies]]
name = "tcp1_xxxxx"
type = "tcp"
localIP = "192.168.1.3"
localPort = 22
remotePort = 22222
